server:
  port: 8080

spring:
  application:
    name: movie-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moviebooking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none        # schema do Flyway quản lý (db/migration)
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long!}
    access-minutes: 60
    refresh-days: 7
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  booking:
    hold-minutes: 10
    max-seats: 8
  payment:
    callback-secret: ${PAYMENT_SECRET:mock-gateway-secret}
